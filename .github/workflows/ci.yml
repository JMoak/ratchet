name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (types, lint, tests, build, pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run build

      # The emitted CLI must start under plain Node, not only under Bun.
      - run: node dist/bin/ratchet.js help

      - name: pack dry run
        run: bun pm pack --dry-run --ignore-scripts
